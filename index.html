<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fundación Cudeca - Tu Apoyo es Esperanza</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <div class="logo">
            <img src="images/logo.jpg" alt="Fundación Cudeca Logo" class="logo-img">
        </div>
        <h1 class="header-title">Tu Apoyo es <span class="esperanza">Esperanza</span></h1>
        <button class="login-btn">
            <span>👤</span>
            ACCEDE/REGÍSTRATE
        </button>
    </header>

    <div class="hero-section">
        <div class="hero-image">
            <img src="images/abuelitas.jpg" alt="Mujeres sonriendo en jardín">
            <button class="explore-btn">EXPLORAR EVENTOS</button>
        </div>

        <div class="events-section">
            <h2 class="events-title">Eventos Próximos</h2>
            <div class="events-grid">
                <div class="event-card">
                    <div class="event-tag">MARCHA POR LA VIDA</div>
                    <img class="event-image" src="images/walkathon.jpg" alt="walkathon">
                    <div class="event-footer">
                        <div class="event-date">
                            <span>📅</span>
                            <span>23/11/2025</span>
                        </div>
                        <button class="buy-btn">COMPRAR</button>
                    </div>
                </div>

                <div class="event-card">
                    <div class="event-tag">CAMINATA SOLIDARIA</div>
                    <img class="event-image" src="images/caminata.jpg" alt="Caminata">
                    <div class="event-footer">
                        <div class="event-date">
                            <span>📅</span>
                            <span>30/01/2026</span>
                        </div>
                        <button class="buy-btn">COMPRAR</button>
                    </div>
                </div>

                <div class="event-card">
                    <div class="event-tag">CONCIERTO INDIE</div>
                    <img class="event-image" src="images/concierto.jpg" alt="Concierto">
                    <div class="event-footer">
                        <div class="event-date">
                            <span>📅</span>
                            <span>18/02/2026</span>
                        </div>
                        <button class="buy-btn">COMPRAR</button>
                    </div>
                </div>

                <div class="event-card">
                    <div class="event-tag">MERCADILLO VINTAGE</div>
                    <img class="event-image" src="images/mercadillo.jpg" alt="Mercadillo">
                    <div class="event-footer">
                        <div class="event-date">
                            <span>📅</span>
                            <span>04/01/2026</span>
                        </div>
                        <button class="buy-btn">COMPRAR</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
