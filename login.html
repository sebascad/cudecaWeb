<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fundación Cudeca - Login Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .left-section {
            background-color: #f5f5dc;
            width: 40%;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .logo-container {
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo {
            width: 350px;
            height: auto;
        }

        .welcome-text {
            color: #7b8a9e;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        .form-container {
            flex-grow: 1;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 12px 15px;
        }

        .input-icon {
            color: #666;
            margin-right: 10px;
            font-size: 18px;
        }

        input {
            border: none;
            outline: none;
            width: 100%;
            font-size: 14px;
            color: #999;
        }

        input::placeholder {
            color: #999;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-login {
            background-color: #ffd700;
            color: #333;
        }

        .btn-login:hover {
            background-color: #ffed4e;
        }

        .btn-create {
            background-color: #fff5cc;
            color: #333;
        }

        .btn-create:hover {
            background-color: #ffeb99;
        }

        .btn-icon {
            font-size: 16px;
        }

        .forgot-password {
            color: #7b8a9e;
            font-size: 13px;
            text-decoration: none;
            display: block;
            margin-top: 15px;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .footer-text {
            color: #999;
            font-size: 12px;
            margin-top: auto;
        }

        .right-section {
            width: 60%;
            background-image: url('images/yayo.jpg');
            background-size: cover;
            background-position: center;
            position: relative;
            overflow: hidden;
        }

        @media (max-width: 968px) {
            .container {
                flex-direction: column;
            }

            .left-section {
                width: 100%;
            }

            .right-section {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-section">
            <div>
                <div class="logo-container">
                    <img class="logo" src="images/logo.jpg" alt="Fundación Cudeca - Cuidados del Cáncer">
                </div>

                <h1 class="welcome-text">BIENVENIDO/A</h1>

                <div class="form-container">
                    <div class="input-group">
                        <div class="input-wrapper">
                            <span class="input-icon">👤</span>
                            <input type="text" placeholder="Correo Electrónico / Usuario">
                        </div>
                    </div>

                    <div class="input-group">
                        <div class="input-wrapper">
                            <span class="input-icon">🔒</span>
                            <input type="password" placeholder="Contraseña">
                        </div>
                    </div>

                    <button class="btn btn-login">
                        <span class="btn-icon">✦</span>
                        INICIAR SESIÓN
                    </button>

                    <button class="btn btn-create">
                        <span class="btn-icon">✦</span>
                        CREAR CUENTA
                    </button>

                    <a href="#" class="forgot-password">¿Has olvidado tu contraseña?</a>
                </div>
            </div>

            <div class="footer-text">
                Fundación Cudeca © 2025 - Nuestro lema es añadir vida a tus días
            </div>
        </div>

        <div class="right-section">
        </div>
    </div>
</body>
</html>
